name: Live data smoke test

# Fetches real SEC filings, prices and rates, and checks the live TTM build against a figure KCI recorded.
# Run by hand from the Actions tab. Needs SEC_USER_AGENT (your name and contact email, which SEC requires),
# preferably as a repository secret so it is masked in the public logs; a repository variable also works. Prices come from Yahoo Finance (unofficial, personal use only) with TIINGO_TOKEN as the fallback.

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Optional: tickers to list filed XBRL concepts for (diagnostics only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check configuration
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Set SEC_USER_AGENT as a repository secret (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - run: pip install -e .
      - name: Concept diagnostics
        if: inputs.diagnose != ''
        env:
          DIAGNOSE: ${{ inputs.diagnose }}
        # shellcheck disable=SC2086
        run: python scripts/concept_diag.py $DIAGNOSE
      - name: Filing instance diagnostics
        if: inputs.diagnose != ''
        env:
          DIAGNOSE: ${{ inputs.diagnose }}
        # shellcheck disable=SC2086
        run: python scripts/instance_diag.py $DIAGNOSE
      - name: Smoke test
        run: python scripts/live_smoke.py
      - name: Yahoo quotes, bars and headlines
        if: always()
        run: |
          python -m keers.data --db /tmp/yahoo-check.sqlite quote DBX ADBE SPY
          python -m keers.data --db /tmp/yahoo-check.sqlite bars DBX --interval 5m --range 1d
          python -m keers.data --db /tmp/yahoo-check.sqlite news DBX --count 3
      - name: Distress screen on the test list
        if: always()
        run: python scripts/distress_screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke
          path: |
            smoke-out/*.json
            screen-out/distress.*
