name: Data refresh

# Refreshes filings, prices and rates for the universe every weekday evening (US time) and keeps the database in
# the Actions cache. It does nothing until SEC_USER_AGENT is set (a repository secret is preferred, so it is masked
# in the public logs; a repository variable also works).

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
      TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
      KEERS_DB: data/keers.sqlite
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SEC_USER_AGENT is not set, so the refresh is skipped"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: pip install -e .
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/cache/restore@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          path: data/keers.sqlite
          key: keers-db-${{ github.run_id }}
          restore-keys: keers-db-
      - name: Refresh
        id: refresh
        if: steps.cfg.outputs.enabled == 'true'
        continue-on-error: true
        run: python -m keers.data refresh --universe config/universe/kci100.txt
      - uses: actions/cache/save@v4
        if: always() && steps.cfg.outputs.enabled == 'true'
        with:
          path: data/keers.sqlite
          key: keers-db-${{ github.run_id }}
      - name: Report
        if: always() && steps.cfg.outputs.enabled == 'true'
        run: python -m keers.data status | head -1
      - name: Fail if any company failed
        if: steps.cfg.outputs.enabled == 'true' && steps.refresh.outcome != 'success'
        run: exit 1
