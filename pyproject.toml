[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keers"
version = "0.0.1"
description = "Keers & Co: research platform core (valuation, data, risk)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/keers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (downloads the pinned KCI page)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
