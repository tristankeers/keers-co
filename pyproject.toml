[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keers"
version = "0.0.1"
description = "Keers & Co: research platform core (valuation, data, risk)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The research workbench (python -m keers.web). The core packages keep no third-party runtime dependencies.
web = ["fastapi>=0.115", "uvicorn>=0.30", "certifi>=2024.2.2"]
# Optional: lets the research agents use Claude (needs ANTHROPIC_API_KEY, a paid API). Without it they use rules-v1.
agents = ["anthropic>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "certifi>=2024.2.2",
       "anthropic>=2.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/keers"]
artifacts = ["src/keers/web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (downloads the pinned KCI page)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # line length is left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S311"]

[tool.mypy]
strict = true
files = ["src"]
